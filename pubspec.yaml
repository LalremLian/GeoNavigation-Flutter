name: geo_navigation
description: "Geo Navigation App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # State management + dependency injection
  get: ^4.6.6

  # Map rendering with OpenStreetMap
  flutter_map: ^7.0.2

  # LatLng coordinate type used by flutter_map
  latlong2: ^0.9.1

  # Lightweight HTTP client for OSRM routing API
  http: ^1.2.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
